[package]
name = "voltafabric"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
num-bigint = "=0.4.6"
vf-qpn2-ffi = { path = "crates/qpn2-ffi", optional = true }
vf-ggml-native-ffi = { path = "crates/ggml-native-ffi", optional = true }
safetensors = { version = "=0.8.0", default-features = false, features = ["alloc", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }

[features]
c-abi-validation = ["dep:vf-qpn2-ffi"]
native-ggml-cpu = ["dep:vf-ggml-native-ffi"]

[lib]
name = "voltafabric"
path = "src/lib.rs"

[[bin]]
name = "vf"
path = "src/main.rs"

[profile.release]
overflow-checks = true
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "vf-rank-worker"
path = "src/bin/vf-rank-worker.rs"

[[bin]]
name = "vf-rank-session"
path = "src/bin/vf-rank-session.rs"

[[bin]]
name = "vf-strata-native-bridge"
path = "src/bin/vf-strata-native-bridge.rs"
required-features = ["native-ggml-cpu"]

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[workspace]
members = ["crates/qpn2-ffi", "crates/ggml-native-ffi"]
exclude = ["gpu-worker"]
default-members = ["."]
resolver = "2"

[[bin]]
name = "vf-sc117-qkv"
path = "src/bin/vf-sc117-qkv.rs"
required-features = ["native-ggml-cpu"]

[[bin]]
name = "vf-sc117-gdn-output"
path = "src/bin/vf-sc117-gdn-output.rs"
required-features = ["native-ggml-cpu"]

[[bin]]
name = "vf-sc117-shared-output"
path = "src/bin/vf-sc117-shared-output.rs"
required-features = ["native-ggml-cpu"]

[[bin]]
name = "vf-sc117-layer1-gdn"
path = "src/bin/vf-sc117-layer1-gdn.rs"
required-features = ["native-ggml-cpu"]

[[bin]]
name = "vf-sc117-layer1-route"
path = "src/bin/vf-sc117-layer1-route.rs"
required-features = ["native-ggml-cpu"]

[[bin]]
name = "vf-sc117-layer1-shared"
path = "src/bin/vf-sc117-layer1-shared.rs"
required-features = ["native-ggml-cpu"]

[[bin]]
name = "vf-sc117-gdn-stage"
path = "src/bin/vf-sc117-gdn-stage.rs"
required-features = ["native-ggml-cpu"]

[[bin]]
name = "vf-sc117-reserved-integration"
path = "src/bin/vf-sc117-reserved-integration.rs"
required-features = ["native-ggml-cpu"]

[[bin]]
name = "vf-sc117-post-stage"
path = "src/bin/vf-sc117-post-stage.rs"
required-features = ["native-ggml-cpu"]

[[bin]]
name = "vf-sc117-layer2-reserved"
path = "src/bin/vf-sc117-layer2-reserved.rs"
required-features = ["native-ggml-cpu"]
